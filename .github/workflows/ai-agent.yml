name: AI Job Hunter Agent

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ai-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          DASHBOARD_API_URL: ${{ secrets.DASHBOARD_API_URL }}
        run: python main_agent.py

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/*.json dashboard/*.json
          git diff --cached --quiet || git commit -m "Update job dashboard data"
          git pull --rebase --autostash origin main
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the whole repo (not just dashboard/) so the deployed URL scheme matches
          # https://bingaditya.github.io/Job-Scraper-Agent/dashboard/home.html (entry point;
          # login.html/signup.html/preferences.html/jobs.html are the other multi-tenant pages).
          # This is now the sole Pages deployer (static.yml was removed) since a push made by
          # this job's own GITHUB_TOKEN commit does not retrigger other workflows.
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

