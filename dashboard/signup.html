<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign Up — AI Job Hunter</title>
<link rel="stylesheet" href="styles.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="page-shell">
    <header class="hero form-panel">
      <p class="eyebrow">GET STARTED</p>
      <h1 style="font-size: 2.2rem;">Create your account</h1>
      <p class="hero-copy">Sign up to upload your resume and start getting matched jobs.</p>
    </header>

    <main>
      <section class="panel form-panel">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="new-password" />
        </div>
        <button id="signup-btn" class="btn btn-primary" type="button">Sign Up</button>
        <p id="status" class="muted" style="margin-top:12px;"></p>
        <p id="error" class="form-error" hidden></p>
        <p class="form-links">Already have an account? <a href="login.html">Sign in</a></p>
      </section>
    </main>
  </div>

  <script type="module">
    import { initSupabase } from "./app-shared.js";

    const errorEl = document.getElementById("error");
    const statusEl = document.getElementById("status");
    const signupBtn = document.getElementById("signup-btn");

    let supabaseClient = null;

    async function init() {
      supabaseClient = await initSupabase((message) => {
        errorEl.textContent = message;
        errorEl.hidden = false;
      });
      if (!supabaseClient) return;
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) window.location.href = "preferences.html";
    }

    signupBtn.addEventListener("click", async () => {
      errorEl.hidden = true;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      signupBtn.disabled = true;
      const { error } = await supabaseClient.auth.signUp({ email, password });
      signupBtn.disabled = false;
      if (error) {
        errorEl.textContent = error.message;
        errorEl.hidden = false;
      } else {
        statusEl.textContent = "Check your email to confirm your account, then sign in.";
      }
    });

    init();
  </script>
</body>
</html>
