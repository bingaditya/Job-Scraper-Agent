services:
  - type: web
    name: job-scraper-agent-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python dashboard_server.py --host 0.0.0.0
    envVars:
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: job-scraper-resume-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn job_hunter.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PROFILE_PATH
        value: config/profile.example.json
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SENTRY_DSN
        sync: false
